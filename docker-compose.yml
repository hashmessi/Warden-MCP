version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: warden_postgres
    environment:
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: warden_dev
      POSTGRES_DB: warden_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warden -d warden_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: warden_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Optional: Run seed data population after both DBs are healthy
  # Usage: docker-compose --profile seed up
  seed:
    profiles: ["seed"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm ci --ignore-scripts && npm run seed"
    environment:
      POSTGRES_URL: postgresql://warden:warden_dev@postgres:5432/warden_db
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB: warden_db
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
